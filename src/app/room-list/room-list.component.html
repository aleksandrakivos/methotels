@if (rooms().length === 0) {
  <p class="py-4 text-center text-xs text-neutral-500">Nema dodatih soba.</p>
} @else {
  <div class="w-full overflow-x-auto border border-neutral-200 rounded-sm">
    <table class="w-full table-fixed border-collapse text-left text-sm" aria-label="Lista smeštaja">
      <colgroup>
        <col class="w-[12%]" />
        <col class="w-[9%]" />
        <col class="w-[9%]" />
        <col class="w-[7%]" />
        <col class="w-[15%]" />
        <col class="w-[9%]" />
        <col class="w-[7%]" />
        <col class="w-[18%]" />
        <col class="w-[14%]" />
      </colgroup>
      <thead>
        <tr class="border-b border-neutral-200 bg-brand-muted">
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Naziv</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Tip</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Cena/noć</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Noći</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Usluge</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Ukupno</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Kreveti</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Opis</th>
          <th scope="col" class="px-2 py-1 text-xs font-semibold text-neutral-800">Akcije</th>
        </tr>
      </thead>
      <tbody>
        @for (room of rooms(); track room.id) {
          <tr
            app-room-item
            [room]="room"
            (editRequested)="editRoom.emit($event)"
            (deleteRequested)="deleteRoom.emit($event)"
          ></tr>
        }
      </tbody>
    </table>
  </div>
}
