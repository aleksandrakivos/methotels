<div class="min-h-screen bg-neutral-50">
  <header class="border-b border-brand bg-white">
    <div class="flex items-center gap-2 px-3 py-2">
      <div
        class="flex h-7 w-7 shrink-0 items-center justify-center rounded-sm bg-brand text-[10px] font-bold tracking-wider text-white"
        aria-hidden="true"
      >
        MH
      </div>
      <h1 class="text-base font-semibold tracking-tight">
        <span class="text-brand">Met</span><span class="text-neutral-900">Hotels</span>
      </h1>
    </div>
  </header>

  <main class="px-3 py-3 space-y-3">
    <app-nav-bar
      [activeSection]="activeSection()"
      (sectionChange)="activeSection.set($event)"
    />

    <section
      class="border border-neutral-200 bg-white rounded-sm p-3"
      aria-live="polite"
      role="tabpanel"
      [id]="'panel-' + activeSection()"
      [attr.aria-labelledby]="'section-heading-' + activeSection()"
    >
      <h2
        [id]="'section-heading-' + activeSection()"
        class="text-sm font-semibold text-neutral-900 mb-2"
      >
        @switch (activeSection()) {
          @case ('ponuda') { Ponuda }
          @case ('preporuka') { Preporuka }
          @case ('o-nama') { O nama }
        }
      </h2>

      @switch (activeSection()) {
        @case ('ponuda') {
          <app-offer-list />
        }
        @case ('preporuka') {
          <app-recommendation-list />
        }
        @case ('o-nama') {
          <app-about />
        }
      }
    </section>

    <section
      class="border border-neutral-200 bg-white rounded-sm p-3"
      aria-labelledby="room-form-heading"
    >
      <h2 id="room-form-heading" class="text-sm font-semibold text-neutral-900 mb-2">
        Dodaj novi smeštaj
      </h2>
      <app-room-form (roomSubmitted)="addNewRoom($event)" />
    </section>

    <section
      class="border border-neutral-200 bg-white rounded-sm p-3"
      aria-labelledby="room-list-heading"
    >
      <h2 id="room-list-heading" class="text-sm font-semibold text-neutral-900 mb-2">
        Lista smeštaja
      </h2>
      <app-room-list [rooms]="rooms()" />
    </section>
  </main>
</div>
