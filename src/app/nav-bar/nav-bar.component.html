<nav aria-label="Glavna navigacija">
  <div
    class="flex gap-1 border border-neutral-200 bg-white rounded-sm p-1"
    role="tablist"
    aria-label="Sekcije sajta"
  >
    @for (section of sections; track section.id) {
      <button
        type="button"
        role="tab"
        [id]="'tab-' + section.id"
        [attr.aria-selected]="activeSection() === section.id"
        [attr.aria-controls]="'panel-' + section.id"
        [attr.aria-current]="activeSection() === section.id ? 'page' : null"
        [class]="
          activeSection() === section.id
            ? 'flex-1 rounded-sm bg-brand px-3 py-1.5 text-sm font-medium text-white'
            : 'flex-1 rounded-sm px-3 py-1.5 text-sm font-medium text-neutral-700 hover:bg-brand-muted focus:outline-none focus:ring-1 focus:ring-brand'
        "
        (click)="selectSection(section.id)"
      >
        {{ section.label }}
      </button>
    }
  </div>
</nav>
