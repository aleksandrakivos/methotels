@if (offers.length === 0) {
  <p class="py-4 text-center text-xs text-neutral-500">Nema dostupnih ponuda.</p>
} @else {
  <ul class="space-y-2" aria-label="Lista ponuda">
    @for (offer of offers; track offer.title) {
      <li class="border border-neutral-200 rounded-sm p-2">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h3 class="text-sm font-semibold text-neutral-900">{{ offer.title }}</h3>
            <p class="mt-0.5 text-xs text-neutral-600">{{ offer.description }}</p>
          </div>
          <span class="shrink-0 text-xs font-medium text-brand">{{ offer.price }}</span>
        </div>
      </li>
    }
  </ul>
}
