<div class="space-y-2 text-sm">
  <h3 class="font-semibold text-neutral-900">{{ hotelInfo.name }}</h3>
  <p class="text-xs text-neutral-600">{{ hotelInfo.description }}</p>
  <dl class="grid gap-1 text-xs">
    <div class="flex gap-2">
      <dt class="font-medium text-neutral-700 shrink-0">Adresa:</dt>
      <dd class="text-neutral-600">{{ hotelInfo.address }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="font-medium text-neutral-700 shrink-0">Telefon:</dt>
      <dd class="text-neutral-600">{{ hotelInfo.phone }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="font-medium text-neutral-700 shrink-0">Email:</dt>
      <dd class="text-neutral-600">{{ hotelInfo.email }}</dd>
    </div>
    <div class="flex gap-2">
      <dt class="font-medium text-neutral-700 shrink-0">Radno vreme:</dt>
      <dd class="text-neutral-600">{{ hotelInfo.workingHours }}</dd>
    </div>
  </dl>
</div>
