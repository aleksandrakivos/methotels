@if (recommendations.length === 0) {
  <p class="py-4 text-center text-xs text-neutral-500">Nema preporuka.</p>
} @else {
  <ul class="space-y-2" aria-label="Lista preporuka">
    @for (item of recommendations; track item.title) {
      <li class="border border-neutral-200 rounded-sm p-2">
        <div class="flex items-start justify-between gap-2">
          <div>
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-semibold text-neutral-900">{{ item.title }}</h3>
              <span
                class="rounded-sm bg-brand-muted px-1.5 py-0.5 text-[10px] font-medium text-brand"
              >
                {{ categoryLabels[item.category] }}
              </span>
            </div>
            <p class="mt-0.5 text-xs text-neutral-600">{{ item.description }}</p>
            <p class="mt-0.5 text-xs text-neutral-500">{{ item.location }}</p>
          </div>
        </div>
      </li>
    }
  </ul>
}
